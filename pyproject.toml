[project]
name = "fitness-tracker"
version = "7.0"
description = "体脂体重监控 + 22周训练计划 + AI 教练 (PySide6)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5",
    "pandas>=1.3",
    "numpy>=1.20",
    "matplotlib>=3.4",
    "pillow>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=7.0",
    "pre-commit>=3.0",
]

# ============================================================
# ruff —— lint + format 一体化 (GitHub: astral-sh/ruff)
# 目标保持 Python 3.8 兼容: target-version = "py38"
# ============================================================
[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = [
    ".venv",
    "dist",
    "build",
    "Lzheng-fitness",         # 子模块(独立仓库)
    "fitness-tracker",        # 子模块/镜像仓库
    "fitness-tracker-remote", # 子模块/镜像仓库
    "exercises-dataset",      # 原始数据集
    "BettaFish",
    "体重体脂监控/个人训练系统",  # 个人训练文档/数据
    "补全数据.py",             # 个人数据补全脚本(一次性)
    "体脂体重监控全系列脚本",   # 归档系列脚本
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle 错误(硬核)
    "F",                # pyflakes(未用/未定义变量)
    "I",                # isort 导入排序
    "UP",               # pyupgrade(尊重 py38 目标)
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "RUF",              # ruff 专属
]
ignore = [
    "E501",   # 行宽交由 ruff-format 处理
    "RUF012", # 配置常量字典类属性(PHASE_MACROS 等)按惯例视为不可变, 不强制 ClassVar
    "RUF001", # 中文文本含全角标点是正常书写, 不视为混淆字符
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["."]
